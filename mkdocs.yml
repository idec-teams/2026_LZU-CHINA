site_name: GutSentry · Evolution Atlas
site_description: Explore signals, selection, evidence and shared learning with LZU-CHINA at iDEC 2026.
site_url: https://idec-teams.github.io/2026_LZU-CHINA/

theme:
  name: material
  custom_dir: overrides
  font: false
  logo: img/gutsentry-mark.svg
  favicon: img/gutsentry-mark.svg
  palette:
    - scheme: default
      primary: teal
      accent: amber
  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.action.edit
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences

extra_css:
  - stylesheets/extra.css
  - stylesheets/editorial.css
  - stylesheets/atlas.css

extra_javascript:
  - javascripts/experience.js
  - javascripts/atlas.js

edit_uri: edit/main/docs/
repo_url: https://github.com/idec-teams/2026_LZU-CHINA

copyright: Copyright &copy; 2026 iDEC. CC-BY-4.0 | The International Directed Evolution Competition (iDEC) is a Scottish Charitable Incorporate Organisation (SCIO), registered in Scotland, with charity number SC050826.

nav:
  - Journey:
      - Evolution Atlas: index.md
      - The project story: project/story.md
      - Interactive learning lab: learn/index.md
      - Evolution perspective: project/evolution.md
  - Research:
      - Research desk: research/index.md
      - Background: project/background.md
      - System design: project/design.md
      - Experimental results: project/results.md
      - Evidence guide: project/evidence.md
  - Community:
      - IHP: human-practices/index.md
      - Education: human-practices/education.md
      - Entrepreneurship: human-practices/entrepreneurship.md
      - Inclusivity: human-practices/inclusivity.md
      - Sustainability: human-practices/sustainability.md
      - Collaboration: human-practices/collaboration.md
  - Library:
      - Open library: library/index.md
      - Methods: documentation/protocols.md
      - Engineering index: documentation/notebook.md
      - Retrospective journal: documentation/diary.md
      - Responsible research: responsible-research.md
      - Data and references: resources.md
      - Attributions: attributions.md
      - Complete activity records:
          - Education record: human-practices/education-record.md
          - Collaboration record: human-practices/collaboration-record.md
          - Inclusivity record: human-practices/inclusivity-record.md
          - Detailed planning: human-practices/entrepreneurship-record.md
          - SDG assessment: human-practices/sustainability-record.md
  - All paths: atlas/index.md
